<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VISOMATIC — Visual Editing Studio</title>
    <meta name="description" content="VISOMATIC is a high-end visual editing, motion graphics, and color studio for visual creators. Narrative, social, commercials, and YouTube." />
    
    <!-- Google Fonts: Caveat (Handwritten) + Instrument Serif (Editorial) + Plus Jakarta Sans + Space Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Tailwind CDN with Aurora, Editorial & Handwritten Configuration -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              gold: {
                DEFAULT: '#C9A15B',
                400: '#DFC068',
                500: '#C9A15B',
                600: '#B88F46',
              },
              aurora: {
                violet: '#8B5CF6',
                purple: '#A855F7',
                cyan: '#06B6D4',
                emerald: '#10B981',
                pink: '#EC4899',
                amber: '#F59E0B',
              },
              night: {
                950: '#050508',
                900: '#08080D',
                850: '#0E0E16',
                800: '#14141F',
              }
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
              editorial: ['"Instrument Serif"', 'Georgia', 'serif'],
              hand: ['"Caveat"', 'cursive'],
              mono: ['"Space Mono"', 'monospace'],
            }
          }
        }
      }
    </script>

    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://esm.sh/react-dom@^19.1.1/",
        "react/": "https://esm.sh/react@^19.1.1/",
        "react": "https://esm.sh/react@^19.1.1",
        "framer-motion": "https://esm.sh/framer-motion@^12.23.12"
      }
    }
    </script>
    
    <link rel="stylesheet" href="/index.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2241674968237091" crossorigin="anonymous"></script>
  </head>
  <body class="bg-[#07070A] text-white selection:bg-aurora-violet selection:text-white antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
